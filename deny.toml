[advisories]
# This is `paste` crate being unmaintained.
# We're okay with that for now, it's not broken, just old.
ignore = [
  "RUSTSEC-2024-0436",
  # Direct serialization dependency; unmaintained notice has no safe upgrade.
  "RUSTSEC-2025-0141",
  # Compile-time macro dependency; replacement requires a separate macro migration.
  "RUSTSEC-2026-0173",
  # Current text stack has no compatible maintained parser replacement.
  "RUSTSEC-2026-0192",
  # quick-xml is reachable only through best-effort Linux/Wayland dependencies.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "Zlib",
  "ISC",
  "Unlicense",
  "Unicode-3.0",

  # Kira uses this license, if the source is modified we need to publish the files changes
  "MPL-2.0",
]

# Ignore our own workspace crates
private = { ignore = true }

[bans]
multiple-versions = "allow"

deny = [
  { name = "glam", deny-multiple-versions = true },
  { name = "raw-window-handle", deny-multiple-versions = true },
]
